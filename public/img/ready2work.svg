    <text x="56" y="124" font-family="monospace" font-size="11" fill="#38bdf8">public AssessmentResult evaluate(Candidate c) {</text>
    <text x="72" y="144" font-family="monospace" font-size="11" fill="#a0aec0">boolean isReady = c.hasSkill("Java") &amp;&amp; c.isDedicated();</text>
