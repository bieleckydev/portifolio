<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="criptoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#12151d"/>
    </linearGradient>
    <linearGradient id="candleGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="candleRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="areaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b87333" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b87333" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#criptoBg)"/>

  <!-- Top Terminal Bar -->
  <rect x="24" y="18" width="752" height="46" rx="8" fill="#141720" stroke="#252936" stroke-width="1"/>
  <circle cx="46" cy="41" r="5" fill="#ef4444"/>
  <circle cx="62" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="78" cy="41" r="5" fill="#10b981"/>

  <text x="106" y="45" font-family="monospace" font-size="12" font-weight="700" fill="#e09858">CRYPTO BROKERAGE PLATFORM // JAVA OOP ENGINE</text>
  
  <rect x="560" y="28" width="204" height="26" rx="6" fill="#1e2330" stroke="#32384a" stroke-width="1"/>
  <circle cx="576" cy="41" r="4" fill="#10b981"/>
  <text x="590" y="45" font-family="monospace" font-size="10" font-weight="600" fill="#a0aec0">PORTFOLIO: $128,450.00 USD</text>

  <!-- Market Strip -->
  <g transform="translate(24, 72)">
    <rect width="752" height="34" rx="6" fill="#12151e" stroke="#202430" stroke-width="1"/>
    <text x="20" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">BTC/USD <tspan fill="#10b981">$94,320.50 +3.4% ▲</tspan></text>
    <text x="210" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">ETH/USD <tspan fill="#10b981">$3,480.10 +2.1% ▲</tspan></text>
    <text x="390" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">SOL/USD <tspan fill="#10b981">$212.80 +5.8% ▲</tspan></text>
    <text x="570" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">JAVA VM: <tspan fill="#e09858">60 TPS • 0 DOWNTIME</tspan></text>
  </g>

  <!-- Left: Candlestick Chart Area -->
  <g transform="translate(24, 116)">
    <rect width="500" height="310" rx="8" fill="#141721" stroke="#252936" stroke-width="1"/>
    
    <!-- Chart Header -->
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">BTC / USD • SIMULAÇÃO DE ORDEM &amp; LIQUIDEZ</text>
    <text x="20" y="48" font-family="monospace" font-size="10" fill="#b87333">ALGORITMO DE CASAMENTO DE ORDENS (MATCHING ENGINE)</text>

    <!-- Chart Grid -->
    <g stroke="#1e2330" stroke-width="1" stroke-dasharray="3,3">
      <line x1="20" y1="80" x2="480" y2="80"/>
      <line x1="20" y1="130" x2="480" y2="130"/>
      <line x1="20" y1="180" x2="480" y2="180"/>
      <line x1="20" y1="230" x2="480" y2="230"/>
      <line x1="20" y1="280" x2="480" y2="280"/>
    </g>

    <!-- Candlesticks -->
    <!-- Candle 1 Green -->
    <line x1="50" y1="210" x2="50" y2="160" stroke="#10b981" stroke-width="1.5"/>
    <rect x="44" y="175" width="12" height="25" fill="url(#candleGreen)" rx="1"/>

    <!-- Candle 2 Green -->
    <line x1="80" y1="190" x2="80" y2="140" stroke="#10b981" stroke-width="1.5"/>
    <rect x="74" y="150" width="12" height="30" fill="url(#candleGreen)" rx="1"/>

    <!-- Candle 3 Red -->
    <line x1="110" y1="140" x2="110" y2="180" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="104" y="155" width="12" height="20" fill="url(#candleRed)" rx="1"/>

    <!-- Candle 4 Green -->
    <line x1="140" y1="160" x2="140" y2="110" stroke="#10b981" stroke-width="1.5"/>
    <rect x="134" y="125" width="12" height="30" fill="url(#candleGreen)" rx="1"/>

    <!-- Candle 5 Green -->
    <line x1="170" y1="130" x2="170" y2="90" stroke="#10b981" stroke-width="1.5"/>
    <rect x="164" y="100" width="12" height="28" fill="url(#candleGreen)" rx="1"/>

    <!-- Candle 6 Red -->
    <line x1="200" y1="95" x2="200" y2="135" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="194" y="105" width="12" height="22" fill="url(#candleRed)" rx="1"/>

    <!-- Candle 7 Green -->
    <line x1="230" y1="115" x2="230" y2="75" stroke="#10b981" stroke-width="1.5"/>
    <rect x="224" y="85" width="12" height="26" fill="url(#candleGreen)" rx="1"/>

    <!-- Candle 8 Green -->
    <line x1="260" y1="90" x2="260" y2="60" stroke="#10b981" stroke-width="1.5"/>
    <rect x="254" y="68" width="12" height="20" fill="url(#candleGreen)" rx="1"/>

    <!-- Candle 9 Red -->
    <line x1="290" y1="65" x2="290" y2="105" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="284" y="75" width="12" height="22" fill="url(#candleRed)" rx="1"/>

    <!-- Candle 10 Green -->
    <line x1="320" y1="85" x2="320" y2="50" stroke="#10b981" stroke-width="1.5"/>
    <rect x="314" y="58" width="12" height="24" fill="url(#candleGreen)" rx="1"/>

    <!-- Candle 11 Green big -->
    <line x1="350" y1="60" x2="350" y2="38" stroke="#10b981" stroke-width="1.5"/>
    <rect x="344" y="42" width="12" height="18" fill="url(#candleGreen)" rx="1"/>

    <!-- Trend line in copper -->
    <path d="M 40 210 Q 120 180, 200 120 T 360 48" fill="none" stroke="#b87333" stroke-width="3"/>
    
    <!-- Moving Average cyan line -->
    <path d="M 40 225 Q 150 190, 250 140 T 360 65" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

    <text x="20" y="298" font-family="monospace" font-size="10" fill="#6e7681">REQUISITOS: POO • ESTRUTURAS DE DADOS • CONTROLE DE SALDOS EM JAVA</text>
  </g>

  <!-- Right: Order Book & Trade Ticket -->
  <g transform="translate(536, 116)">
    <rect width="240" height="310" rx="8" fill="#141721" stroke="#252936" stroke-width="1"/>
    
    <text x="18" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">LIVRO DE OFERTAS (ORDER BOOK)</text>
    
    <!-- Asks (Red) -->
    <text x="18" y="52" font-family="monospace" font-size="10" fill="#ef4444">94,350.00 | 0.84 BTC</text>
    <text x="18" y="68" font-family="monospace" font-size="10" fill="#ef4444">94,340.00 | 1.25 BTC</text>
    <text x="18" y="84" font-family="monospace" font-size="10" fill="#ef4444">94,330.00 | 0.40 BTC</text>

    <!-- Spread center -->
    <rect x="14" y="96" width="212" height="24" rx="4" fill="#1b202c"/>
    <text x="22" y="112" font-family="monospace" font-size="10" font-weight="700" fill="#10b981">SPREAD: $0.50 (0.001%)</text>

    <!-- Bids (Green) -->
    <text x="18" y="138" font-family="monospace" font-size="10" fill="#10b981">94,320.00 | 2.50 BTC</text>
    <text x="18" y="154" font-family="monospace" font-size="10" fill="#10b981">94,310.00 | 1.10 BTC</text>
    <text x="18" y="170" font-family="monospace" font-size="10" fill="#10b981">94,300.00 | 3.80 BTC</text>

    <!-- Trading inputs -->
    <line x1="14" y1="186" x2="226" y2="186" stroke="#252936" stroke-width="1"/>
    
    <rect x="14" y="196" width="102" height="30" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="215" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">COMPRAR</text>

    <rect x="124" y="196" width="102" height="30" rx="4" fill="#1b202c" stroke="#2e3547" stroke-width="1"/>
    <text x="175" y="215" font-family="monospace" font-size="11" font-weight="700" fill="#8c97a8" text-anchor="middle">VENDER</text>

    <!-- Execute simulation btn -->
    <rect x="14" y="240" width="212" height="42" rx="6" fill="#b87333"/>
    <text x="120" y="266" font-family="monospace" font-size="11" font-weight="800" fill="#0f1115" text-anchor="middle">EXECUTAR ORDEM (JAVA)</text>
  </g>
</svg>
